<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaser Platformer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #controls {
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        #controls h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="controls">
            <h3>Controls:</h3>
            <p>A/D - Move | J - Jump | K - Attack</p>
        </div>
        <div id="game"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
